<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nextbell</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Unbounded:wght@500;700&display=swap" rel="stylesheet">
<style>
:root {
  /* Layout: left-aligned headline over a full-width sector mosaic, then instrument panels in a fluid grid. */
  --bg: #0B1022;
  --panel: #121936;
  --raise: #1A2347;
  --line: #2B3768;
  --text: #EAEEFF;
  --muted: #9AA5D4;
  --up: #3CE6D0;
  --down: #FF6B8A;
  --ref: #FFC857;
  --series: #8FA6FF;
  --neutral: #2D386C;
  --display: "Unbounded", "IBM Plex Sans", system-ui, sans-serif;
  --body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html { background: var(--bg); }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font: 400 16px/1.55 var(--body); -webkit-font-smoothing: antialiased;
}
h1, h2, h3 { text-wrap: balance; margin: 0; }
p { margin: 0; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--series); outline-offset: 2px; }
.wrap { max-width: 1200px; margin: 0 auto; padding: 0 20px; }
.num { font-variant-numeric: tabular-nums; }
 [hidden] { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* top bar */
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 18px 0; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; font: 700 19px/1 var(--display); letter-spacing: -0.01em; }
.top-right { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.asof { color: var(--muted); font-size: 14px; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--panel); }
.seg button { border: 0; background: transparent; padding: 6px 12px; cursor: pointer; font-size: 14px; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--raise); color: var(--text); font-weight: 600; }
.seg button:hover { color: var(--text); }

.demo { display: flex; gap: 10px; align-items: flex-start; border: 1px solid var(--ref); background: rgba(255, 200, 87, .08); border-radius: 10px; padding: 10px 14px; font-size: 14px; }
.demo b { color: var(--ref); }

/* hero */
.hero { padding: 36px 0 20px; display: grid; gap: 18px; }
h1 { font: 700 clamp(28px, 4.4vw, 48px)/1.1 var(--display); letter-spacing: -0.025em; max-width: 22ch; }
.lead { color: var(--muted); max-width: 62ch; font-size: 17px; }

.stage { position: relative; border: 1px solid var(--line); border-radius: 14px; background: var(--panel); padding: 12px; overflow: hidden; }
.stage canvas { display: block; width: 100%; border-radius: 6px; cursor: crosshair; touch-action: pan-y; }
.hl { position: absolute; pointer-events: none; border: 2px solid #fff; border-radius: 2px; display: none; box-shadow: 0 0 0 1px rgba(11, 16, 34, .8); }
.scan { position: absolute; top: 0; bottom: 0; left: 0; width: 16%; pointer-events: none; transform: translateX(-100%);
  background: linear-gradient(90deg, transparent, rgba(234, 238, 255, .16), transparent); animation: scan 1.7s .35s ease-out 1 forwards; }
@keyframes scan { to { transform: translateX(640%); } }
.legend-row { display: flex; flex-wrap: wrap; gap: 14px 28px; align-items: center; justify-content: space-between; color: var(--muted); font-size: 14px; }
.ramp { display: flex; align-items: center; gap: 10px; }
.ramp i { display: block; width: 180px; height: 10px; border-radius: 5px; background: linear-gradient(90deg, var(--down), var(--neutral) 50%, var(--up)); }
.counts { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { display: inline-flex; gap: 6px; align-items: center; border: 1px solid var(--line); border-radius: 999px; padding: 3px 11px; background: var(--panel); color: var(--text); font-size: 13px; }
.chip b { font-size: 11px; }
.up-g { color: var(--up); } .down-g { color: var(--down); } .neu-g { color: var(--muted); }

/* sections */
section { padding: 36px 0 8px; }
h2 { font: 500 clamp(22px, 3vw, 30px)/1.15 var(--display); letter-spacing: -0.015em; }
.sub { color: var(--muted); max-width: 70ch; margin-top: 10px; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 20px; }
.grid12 { display: grid; grid-template-columns: repeat(12, 1fr); gap: 16px; margin-top: 20px; align-items: start; }
.c7 { grid-column: span 7; } .c5 { grid-column: span 5; } .c12 { grid-column: span 12; } .c4 { grid-column: span 4; } .c6 { grid-column: span 6; }
@media (max-width: 980px) { .c7, .c5, .c4, .c6 { grid-column: span 12; } }

.ruler-head { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: baseline; }
.ruler-head h3 { font: 600 16px/1.3 var(--body); }
.verdict { display: inline-flex; align-items: center; gap: 8px; border-radius: 999px; padding: 5px 14px; font-size: 14px; border: 1px solid var(--line); background: var(--raise); }
.verdict.up { border-color: var(--up); } .verdict.down { border-color: var(--down); } .verdict.flat { border-color: var(--ref); }
.why { margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--line); }
.why h3 { font: 600 16px/1.3 var(--body); margin-bottom: 6px; }
.why p { color: var(--muted); max-width: 66ch; }

dl.stats { margin: 0; display: grid; }
dl.stats > div { padding: 12px 0; border-bottom: 1px solid var(--line); }
dl.stats > div:last-child { border-bottom: 0; }
dl.stats dt { color: var(--muted); font-size: 14px; }
dl.stats dd { margin: 2px 0 0; font-weight: 600; font-size: 19px; }
dl.stats dd small { font-weight: 400; font-size: 14px; color: var(--muted); }
dl.stats .hint { color: var(--muted); font-size: 13px; font-weight: 400; line-height: 1.4; margin-top: 2px; }
dl.stats .big { font: 700 clamp(34px, 5vw, 46px)/1.05 var(--display); letter-spacing: -0.03em; }

.chart h3 { font: 600 16px/1.3 var(--body); }
.chart .sub { margin-top: 4px; font-size: 14px; }
.chart .legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 13px; color: var(--muted); margin: 12px 0 4px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend svg { width: 22px; height: 10px; }
.cbox { position: relative; width: 100%; }
.cbox svg { display: block; overflow: visible; }
svg .grid { stroke: var(--line); stroke-width: 1; opacity: .55; }
svg .tick { fill: var(--muted); font: 400 11px var(--body); }
svg .axt { fill: var(--muted); font: 400 12px var(--body); }
svg .refc { stroke: var(--ref); stroke-width: 1.5; stroke-dasharray: 5 4; }
svg .refb { stroke: var(--muted); stroke-width: 1.5; stroke-dasharray: 2 4; }
svg .whisk { stroke: var(--series); stroke-width: 2; opacity: .55; }
svg .dot { fill: var(--series); stroke: var(--panel); stroke-width: 2; }
svg .line { fill: none; stroke: var(--series); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
svg .band { fill: var(--raise); opacity: .7; }
svg .cross { stroke: var(--text); stroke-width: 1; opacity: .5; }
svg .lab { fill: var(--text); font: 500 12px var(--body); }
svg .labm { fill: var(--muted); font: 400 12px var(--body); }
details.data { margin-top: 10px; font-size: 13px; color: var(--muted); }
details.data summary { cursor: pointer; width: fit-content; }
details.data table { margin-top: 8px; border-collapse: collapse; width: 100%; }
details.data th, details.data td { text-align: right; padding: 3px 8px; border-bottom: 1px solid var(--line); font-variant-numeric: tabular-nums; }
details.data th:first-child, details.data td:first-child { text-align: left; }

/* screener */
.tools { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; margin: 20px 0 14px; }
.field { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px 12px; min-width: 0; }
.field:focus-visible { outline-offset: 0; }
#q { width: min(320px, 100%); }
.count { color: var(--muted); font-size: 14px; margin-left: auto; }
.tablewrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 14px; background: var(--panel); }
table.t { width: 100%; border-collapse: collapse; min-width: 760px; }
table.t th { text-align: right; font-weight: 500; font-size: 13px; color: var(--muted); padding: 0; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.t th.l, table.t td.l { text-align: left; }
table.t th button { width: 100%; background: none; border: 0; padding: 12px 14px; cursor: pointer; color: inherit; text-align: inherit; font-size: inherit; font-weight: inherit; }
table.t th button:hover { color: var(--text); }
table.t th[aria-sort="ascending"] button::after { content: " ▲"; font-size: 9px; }
table.t th[aria-sort="descending"] button::after { content: " ▼"; font-size: 9px; }
table.t td { padding: 9px 14px; text-align: right; border-bottom: 1px solid var(--line); font-size: 14px; white-space: nowrap; }
table.t tbody tr:last-child td { border-bottom: 0; }
table.t tbody tr:hover td { background: var(--raise); }
table.t tr.flash td { background: rgba(143, 166, 255, .18); }
.tk { font-weight: 600; }
.nm { display: block; color: var(--muted); font-size: 12.5px; max-width: 220px; overflow: hidden; text-overflow: ellipsis; }
.pcell { display: inline-flex; align-items: center; gap: 10px; }
.pbar { position: relative; width: 84px; height: 8px; background: var(--neutral); border-radius: 4px; overflow: hidden; }
.pbar::after { content: ""; position: absolute; left: 50%; top: 0; bottom: 0; width: 1px; background: var(--text); opacity: .5; }
.pbar i { position: absolute; top: 0; bottom: 0; }
.pill { display: inline-flex; gap: 6px; align-items: center; border-radius: 999px; padding: 2px 10px; font-size: 12.5px; border: 1px solid var(--line); background: var(--raise); }
.pill b { font-size: 10px; }
.pill.up { border-color: rgba(60, 230, 208, .55); } .pill.down { border-color: rgba(255, 107, 138, .55); }
.more { margin-top: 14px; display: flex; justify-content: center; }
.btn { border: 1px solid var(--line); background: var(--panel); border-radius: 8px; padding: 9px 18px; cursor: pointer; }
.btn:hover { background: var(--raise); }
.empty { padding: 36px 20px; text-align: center; color: var(--muted); }
@media (max-width: 720px) { .hide-s { display: none; } table.t { min-width: 0; } .nm { max-width: 120px; } table.t td, table.t th button { padding-left: 10px; padding-right: 10px; } }

/* method + footer */
.method { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-top: 20px; }
@media (max-width: 980px) { .method { grid-template-columns: 1fr; } }
.method h3 { font: 600 16px/1.3 var(--body); margin-bottom: 6px; }
.method p { color: var(--muted); font-size: 15px; }
footer { margin-top: 48px; border-top: 1px solid var(--line); padding: 24px 0 56px; color: var(--muted); font-size: 14px; display: grid; gap: 6px; }
footer strong { color: var(--text); }

.tip { position: fixed; z-index: 50; pointer-events: none; background: var(--raise); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font-size: 13px; line-height: 1.4; max-width: 250px; opacity: 0; transition: opacity .08s; }
.tip b { font-weight: 600; }
.tip .m { color: var(--muted); }
.err { margin: 40px 0; padding: 24px; border: 1px solid var(--down); border-radius: 14px; }
@media (prefers-reduced-motion: reduce) { .scan { animation: none; display: none; } .tip { transition: none; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="topbar">
    <div class="brand">
      <svg width="24" height="24" viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="2" width="12" height="12" rx="3" fill="#3CE6D0"/><rect x="10" y="10" width="12" height="12" rx="3" fill="#FF6B8A"/></svg>
      <span>Nextbell</span>
    </div>
    <div class="top-right">
      <span class="asof num" id="asof"></span>
      <div class="seg" role="group" aria-label="Language">
        <button type="button" id="lang-en" aria-pressed="true">EN</button>
        <button type="button" id="lang-mn" aria-pressed="false">МН</button>
      </div>
    </div>
  </header>
  <div class="demo" id="demo" hidden><b data-i18n="demo.lead">Demo data.</b><span data-i18n="demo.body"></span></div>

  <main id="app">
    <div class="hero">
      <h1 id="h1"></h1>
      <p class="lead" data-i18n="hero.lead"></p>
      <div class="stage" id="stage">
        <canvas id="mosaic" role="img" aria-label="Mosaic of all stocks grouped by sector. Use the table below for the same data in text form."></canvas>
        <div class="hl" id="hl"></div>
        <div class="scan" aria-hidden="true"></div>
      </div>
      <div class="legend-row">
        <div class="ramp"><span data-i18n="leg.down"></span><i aria-hidden="true"></i><span data-i18n="leg.up"></span></div>
        <div class="counts" id="counts"></div>
        <span data-i18n="leg.hint"></span>
      </div>
    </div>

    <section id="score">
      <h2 data-i18n="score.title"></h2>
      <p class="sub" id="score-sub"></p>
      <div class="grid12">
        <div class="panel c7">
          <div class="ruler-head"><h3 data-i18n="ruler.title"></h3><span class="verdict" id="verdict"></span></div>
          <div class="cbox" id="ruler"></div>
          <div class="why">
            <h3 data-i18n="why.title"></h3>
            <p data-i18n="why.body"></p>
          </div>
        </div>
        <div class="panel c5">
          <dl class="stats" id="stats"></dl>
        </div>

        <div class="panel chart c4">
          <h3 data-i18n="cd.title"></h3>
          <p class="sub" data-i18n="cd.sub"></p>
          <div class="legend" id="lg-dec"></div>
          <div class="cbox" id="c-dec"></div>
          <details class="data"><summary data-i18n="data.view"></summary><div id="t-dec"></div></details>
        </div>
        <div class="panel chart c4">
          <h3 data-i18n="cr.title"></h3>
          <p class="sub" data-i18n="cr.sub"></p>
          <div class="legend" id="lg-roll"></div>
          <div class="cbox" id="c-roll"></div>
          <details class="data"><summary data-i18n="data.view"></summary><div id="t-roll"></div></details>
        </div>
        <div class="panel chart c4">
          <h3 data-i18n="cc.title"></h3>
          <p class="sub" data-i18n="cc.sub"></p>
          <div class="legend" id="lg-cal"></div>
          <div class="cbox" id="c-cal"></div>
          <details class="data"><summary data-i18n="data.view"></summary><div id="t-cal"></div></details>
        </div>
      </div>
    </section>

    <section id="stocks">
      <h2 data-i18n="tbl.title"></h2>
      <p class="sub" data-i18n="tbl.sub"></p>
      <div class="tools">
        <input class="field" id="q" type="search" autocomplete="off" aria-label="Search">
        <select class="field" id="sector" aria-label="Sector"></select>
        <div class="seg" role="group" aria-label="Lean" id="leanseg">
          <button type="button" data-lean="all" aria-pressed="true"></button>
          <button type="button" data-lean="up" aria-pressed="false"></button>
          <button type="button" data-lean="down" aria-pressed="false"></button>
        </div>
        <span class="count num" id="count" aria-live="polite"></span>
      </div>
      <div class="tablewrap">
        <table class="t">
          <thead><tr id="thead"></tr></thead>
          <tbody id="tbody"></tbody>
        </table>
        <div class="empty" id="empty" hidden></div>
      </div>
      <div class="more"><button type="button" class="btn" id="more"></button></div>
    </section>

    <section id="method">
      <h2 data-i18n="m.title"></h2>
      <div class="method">
        <div class="panel"><h3 data-i18n="m.1.h"></h3><p id="m1"></p></div>
        <div class="panel"><h3 data-i18n="m.2.h"></h3><p id="m2"></p></div>
        <div class="panel"><h3 data-i18n="m.3.h"></h3><p id="m3"></p></div>
      </div>
    </section>
  </main>

  <footer>
    <p><strong data-i18n="f.strong"></strong> <span data-i18n="f.body"></span></p>
    <p id="gen"></p>
  </footer>
</div>
<div class="tip" id="tip" role="tooltip"></div>

<script src="data/predictions.js"></script>

    var v = V();
    document.documentElement.lang = lang;
    document.querySelectorAll("[data-i18n]").forEach(function (el) { el.textContent = t(el.dataset.i18n, v); });
    $("#h1").textContent = t("hero.title", v);
    $("#asof").textContent = t("asof", v);
    $("#score-sub").textContent = t("score.sub", v);
    $("#m1").textContent = t("m.1", v); $("#m2").textContent = t("m.2", v); $("#m3").textContent = t("m.3", v);
    var ec = D.meta.eval_computed;
    $("#gen").textContent = t("gen", { g: D.meta.generated_at, m: D.meta.model,
      e: ec ? (lang === "mn" ? " Backtest-ийг сүүлд бодсон: " + ec + " (долоо хоног бүр шинэчилнэ)." : " Backtest last recomputed " + ec + " (refreshed weekly).") : "" });
    $("#lang-en").setAttribute("aria-pressed", String(lang === "en")); $("#lang-mn").setAttribute("aria-pressed", String(lang === "mn"));
    $("#demo").hidden = D.meta.mode !== "demo";
    var cv = $("#mosaic"); cv.setAttribute("aria-label", lang === "mn" ? "Бүх хувьцааны салбараар бүлэглэсэн мозайк. Ижил өгөгдлийг доорх хүснэгтээс уншина уу." : "Mosaic of all stocks grouped by sector. Use the table below for the same data in text form.");
  }
  function renderAll() {
    renderText(); renderControls(); renderCounts(); renderStats();
    drawMosaic(); renderRuler(); renderDeciles(); renderRolling(); renderCalibration();
    syncLean(); renderTable();
  }
  function setLang(l) { lang = l; try { localStorage.setItem("nextbell-lang", l); } catch (e) {} renderAll(); }
  $("#lang-en").addEventListener("click", function () { setLang("en"); });
  $("#lang-mn").addEventListener("click", function () { setLang("mn"); });

  var rt; var lastW = 0;
  new ResizeObserver(function () {
    var w = $("#stage").clientWidth; if (w === lastW) return; lastW = w;
    clearTimeout(rt); rt = setTimeout(function () { drawMosaic(); renderRuler(); renderDeciles(); renderRolling(); renderCalibration(); }, 120);
  }).observe($("#stage"));

  renderAll();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { drawMosaic(); });
})();
</script>
</body>
</html>
